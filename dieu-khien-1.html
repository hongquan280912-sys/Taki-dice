<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zalo Cuto - Điều khiển</title>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; background: #121212; color: #fff; margin: 0; padding: 16px; }
        .container { max-width: 400px; margin: 0 auto; background: #1e1e1e; padding: 20px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.5); text-align: left; }
        h2 { text-align: center; color: #00ffcc; margin-top: 0; }
        .n { margin-top: 14px; padding: 12px; background: rgba(0,0,0,0.3); border-radius: 8px; }
        .lb { font-size: 14px; margin-bottom: 6px; font-weight: bold; }
        select, input { width: 100%; padding: 10px; font-size: 16px; border-radius: 8px; border: 2px solid #3b9cff; background: #fff; color: #000; box-sizing: border-box; margin-bottom: 10px; }
        button { width: 100%; background-color: #3b9cff; color: #fff; border: none; padding: 15px; font-size: 18px; font-weight: bold; border-radius: 8px; cursor: pointer; margin-top: 15px; }
        button:active { filter: brightness(0.8); }
        .status { font-size: 14px; color: #ffaa00; text-align: center; margin-top: 10px; }
    </style>
</head>
<body>
    <div class="container">
        <h2>Bảng Điều Khiển</h2>
        
        <div class="n">
            <div class="lb">Chọn chế độ chơi:</div>
            <select id="modeSelect" onchange="syncConfig()">
                <option value="n">Roll thường (Nhiều hột xúc xắc)</option>
                <option value="e">Event 2 người</option>
            </select>

            <div class="lb" id="ndLabel">Số lượng xúc xắc (Roll thường): <span id="ndVal">4</span></div>
            <input type="range" id="ndRange" min="1" max="6" value="4" oninput="updateNdVal(); syncConfig();" style="accent-color: #3b9cff;">
        </div>

        <button onclick="triggerRoll()">LẮC XÚ XẮC 🎲</button>
        <div class="status" id="statusMsg">Sẵn sàng điều khiển</div>
    </div>

    <script>
        // Đường dẫn Firebase Database chung của bạn
        const DB_URL = "https://taki-4b68b-default-rtdb.firebaseio.com/taki_room6/config.json";

        function updateNdVal() {
            document.getElementById("ndVal").innerText = document.getElementById("ndRange").value;
        }

        function syncConfig() {
            let mode = document.getElementById("modeSelect").value;
            let nd = parseInt(document.getElementById("ndRange").value);
            
            // Ẩn hiện slider tùy theo chế độ
            if(mode === "e") {
                document.getElementById("ndLabel").style.display = "none";
                document.getElementById("ndRange").style.display = "none";
            } else {
                document.getElementById("ndLabel").style.display = "block";
                document.getElementById("ndRange").style.display = "block";
            }

            let cfg = {
                mode: mode,
                nd: nd,
                configId: Date.now(),
                nEv: { on: true, t: 5, c1: 4, c2: 2, n1: "Người 1", n2: "Người 2" },
                ev: { on: true, t: 5, c1: 4, c2: 2, n1: "Người 1", n2: "Người 2", rig: 0 }
            };

            fetch(DB_URL, {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(cfg)
            })
            .then(res => {
                if(res.ok) {
                    document.getElementById("statusMsg").innerText = "Đã đồng bộ cấu hình thành công!";
                }
            })
            .catch(err => {
                document.getElementById("statusMsg").innerText = "Lỗi kết nối mạng!";
            });
        }

        function triggerRoll() {
            syncConfig();
            document.getElementById("statusMsg").innerText = "Đã gửi lệnh Lắc Xúc Xắc!";
        }
    </script>
</body>
</html>
