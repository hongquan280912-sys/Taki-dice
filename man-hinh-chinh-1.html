<!DOCTYPE html>
<html><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Zalo meo meo - Taki Dice</title>
<style>
*{-webkit-tap-highlight-color:transparent}
body{margin:0;padding:16px;font-family:Arial,sans-serif;background:#3b6ea5;display:flex;justify-content:center}
.box{width:100%;max-width:420px;background:rgba(255,255,255,.25);border:4px solid #fff;border-radius:22px;padding:14px;text-align:center}
h2{color:#fff;margin:0 0 10px;font-size:30px;text-shadow:0 2px 4px #0a3d91}
#dice{display:flex;flex-wrap:wrap;justify-content:center;gap:10px;margin:14px 0;min-height:70px}
.d{width:60px;height:60px;border:5px solid #fff;border-radius:14px;box-shadow:0 0 8px rgba(0,0,0,.3);display:flex;align-items:center;justify-content:center}
.d i,.m i{width:12px;height:12px;border-radius:50%;background:#fff}
button{width:100%;min-height:52px;padding:14px;font-size:22px;font-weight:bold;color:#fff;background:#3b9cff;border:3px solid #fff;border-radius:10px;cursor:pointer;touch-action:manipulation;user-select:none;-webkit-user-select:none}
button:active{filter:brightness(.8)}
button.s{font-size:16px;min-height:46px;padding:9px;margin-top:8px;background:#2a7a4b}
#tb{display:flex;gap:6px;justify-content:flex-end;margin-bottom:6px;align-items:center}
#tb .r{display:flex;gap:6px}
#tb button{width:auto;min-height:38px;padding:4px 10px;font-size:14px;background:rgba(0,0,0,.35);border:2px solid #fff;border-radius:8px}
.lb{color:#fff;font-size:13px;text-align:left;margin-top:6px}
.n{margin-top:14px;padding:8px;background:rgba(0,0,0,.35);color:#fff;font-size:13px;border-radius:8px}
.row{display:flex;justify-content:space-between;gap:4px;margin-top:6px}
.row div{flex:1;padding:6px 0;border-radius:8px;color:#fff;font-weight:bold;font-size:15px;border:2px solid #fff}
#hist{max-height:200px;overflow-y:auto;margin-top:8px;text-align:left}
.h{display:flex;align-items:center;gap:5px;padding:4px 2px;border-bottom:1px dashed #999}
.h span{width:24px;font-weight:bold}
.m{width:22px;height:22px;border:2px solid #fff;border-radius:6px;display:flex;align-items:center;justify-content:center}
.m i{width:5px;height:5px}
#rs{margin-top:8px;background:none;border:none;color:#fff;font-size:14px;text-decoration:underline;padding:8px;width:auto;min-height:40px}
#ban{min-height:34px;margin-top:10px;font-size:22px;font-weight:bold;color:#fff;text-shadow:0 2px 4px #0a3d91}
#vs{font-size:12px;color:#fff;margin-top:6px;min-height:16px}
#score{display:none;margin-top:10px;padding:10px;background:#fff;border-radius:12px;font-size:20px;font-weight:bold;color:#222}
#msg{font-size:14px;font-weight:normal;color:#444;margin-top:4px}
#waiting{margin-top:14px;padding:12px;background:rgba(0,0,0,.35);color:#fff;border-radius:12px;font-size:14px}
details{margin-top:12px;color:#fff;text-align:left}
summary{cursor:pointer;font-weight:bold;padding:10px;background:rgba(0,0,0,.35);border-radius:8px;font-size:15px}
.box.mini #tv,.box.mini #vs,.box.mini .pc,.box.mini details,.box.mini #waiting{display:none!important}
.box.mini h2{font-size:20px;margin-bottom:4px}
.box.mini #dice{margin:8px 0}
.box.mini #score{font-size:16px;margin-top:6px}
</style></head><body>
<div class="box">
<div id="tb">
 <div class="r">
  <button id="zm" aria-label="Thu nhỏ cỡ khung">A−</button>
  <button id="zp" aria-label="Phóng to cỡ khung">A＋</button>
  <button id="mn">▁ Thu nhỏ</button>
 </div>
</div>
<h2>Zalo meo meo</h2>

<div id="waiting">⏳ Đang tải cấu hình...</div>

<div id="score"><div id="sc"></div><div id="msg"></div></div>

<div id="dice"></div>
<div id="ban"></div>
<button id="roll">ROLL AGAIN !</button>
<button class="s" id="tv" style="display:none">🔊 Thử giọng nói</button>
<div id="vs" style="display:none"></div>

<div class="n pc">Possible colors are:
<b style="color:#f00">Red</b>, <b style="color:#ffa500">Orange</b>,
<b style="color:#ffd700">Yellow</b>, <b style="color:#0a0">Green</b>,
<b style="color:#00f">Blue</b>, and <b style="color:#a020f0">Purple</b>.</div>

<details>
<summary>📊 Thống kê (bấm để mở)</summary>
<div class="n" style="margin-top:8px"><b>Tổng số lần ra</b><div class="row" id="st"></div></div>
<div class="n"><b>20 lượt gần nhất</b>
<div class="row" id="st20"></div>
<div id="fc" style="margin-top:8px"></div>
<div id="hist"></div></div>
<div class="n" id="rng"></div>
<button class="s" id="t1k">🧪 Test 1000 lượt (kiểm tra công bằng)</button>
<div class="n" id="t1r" style="display:none"></div>
<button id="rs">Xóa thống kê</button>
</details>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script>
var firebaseConfig = {
  apiKey: "AIzaSyCpvim3K2_FNPkxjSwonmZv1aRDnc_Su7g",
  authDomain: "taki-4b68b.firebaseapp.com",
  databaseURL: "https://taki-4b68b-default-rtdb.firebaseio.com",
  projectId: "taki-4b68b",
  storageBucket: "taki-4b68b.firebasestorage.app",
  messagingSenderId: "943690027603",
  appId: "1:943690027603:web:94a76dd75d313a8bc26ca6",
  measurementId: "G-CE9VKNFFX2"
};
firebase.initializeApp(firebaseConfig);
var db = firebase.database();
var ROOM = "taki_room1";
var cfgRef = db.ref(ROOM + "/config");

var C=["#ff0000","#ffa500","#ffd700","#008000","#0000ff","#800080"];
var CS=["đỏ","cam","vàng","xanh lá","xanh dương","tím"];
var cnt=[0,0,0,0,0,0],rolls=[],fc=0,busy=false;
var mode="n",nd=4;
var ev={on:false,over:false,s1:0,s2:0,t:5,c1:4,c2:2,n1:"Người 1",n2:"Người 2",rig:0};
var q={on:false,rounds:0,house:0,p:[]};
var box=document.getElementById("dice"),ban=document.getElementById("ban");
var $=function(i){return document.getElementById(i);};

function tap(el,fn){
  var last=0;
  function h(e){
    var now=Date.now();
    if(now-last<450)return;
    last=now;
    try{fn(e);}catch(err){}
  }
  el.addEventListener("pointerup",h);
  el.addEventListener("click",h);
}

var ZS=[.6,.7,.8,.9,1,1.1,1.2,1.35,1.5],zi=4,mini=false;
try{
  var sv=JSON.parse(localStorage.getItem("zv")||"null");
  if(sv){
    if(typeof sv.z==="number")zi=Math.max(0,Math.min(ZS.length-1,sv.z));
    mini=!!sv.m;
  }
}catch(e){}
function applyView(){
  var b=document.querySelector(".box"),z=ZS[zi];
  b.style.zoom=z;
  b.style.width=(100/z)+"%";
  b.className=mini?"box mini":"box";
  $("mn").textContent=mini?"⬜ Phóng to":"▁ Thu nhỏ";
  try{localStorage.setItem("zv",JSON.stringify({z:zi,m:mini}));}catch(e){}
}
tap($("zm"),function(){if(zi>0){zi--;applyView();}});
tap($("zp"),function(){if(zi<ZS.length-1){zi++;applyView();}});
tap($("mn"),function(){mini=!mini;applyView();});

function banner(t){ban.textContent=t;clearTimeout(banner.t);banner.t=setTimeout(function(){ban.textContent="";},3500);}

function mini_(c){return '<div class="m" style="background:'+C[c]+'"><i></i></div>';}
function row(a){var h="";for(var i=0;i<6;i++)h+='<div style="background:'+C[i]+'">'+a[i]+'</div>';return h;}
function stats(){
  $("st").innerHTML=row(cnt);
  var c20=[0,0,0,0,0,0];
  rolls.forEach(function(r){r.forEach(function(c){c20[c]++;});});
  $("st20").innerHTML=row(c20);
  $("fc").innerHTML="Four-Colors: <b>"+fc+"</b> 🌈";
  var h="";
  rolls.forEach(function(r,i){h+='<div class="h"><span>'+(i+1)+'.</span>'+r.map(mini_).join("")+'</div>';});
  $("hist").innerHTML=h;
}
function show(res){
  box.innerHTML="";
  res.forEach(function(c){
    var d=document.createElement("div");d.className="d";
    d.style.background=C[c];d.innerHTML="<i></i>";box.appendChild(d);
  });
}
function esc(s){return (s||"").replace(/[&<>]/g,"");}

$("rng").innerHTML="🔒 Random chuẩn bảo mật ✓";
tap($("t1k"),function(){
  var c=[0,0,0,0,0,0],i;
  for(i=0;i<4000;i++)c[rndInt(6)]++;
  var mx=Math.max.apply(null,c),mn=Math.min.apply(null,c);
  $("t1r").style.display="block";
  $("t1r").innerHTML="<b>Test 1000 lượt</b><div class=\"row\">"+row(c)+"</div>";
});

function scoreboard(msg){
  $("score").style.display="block";
  $("sc").innerHTML='<span style="color:'+C[ev.c1]+'">'+esc(ev.n1)+'</span> '+ev.s1+' - '+ev.s2+
    ' <span style="color:'+C[ev.c2]+'">'+esc(ev.n2)+'</span><div style="font-size:13px;font-weight:normal">Chạm '+ev.t+' điểm thắng</div>';
  $("msg").textContent=msg||"";
}

function playEvent(res){
  var a=res.filter(function(c){return c===ev.c1;}).length;
  var b=res.filter(function(c){return c===ev.c2;}).length;
  
  var myScore = (ev.rig === 1) ? ev.s1 : ev.s2;
  var oppScore = (ev.rig === 1) ? ev.s2 : ev.s1;
  
  var m="";
  // Giằng co sát nút ở đầu trận (dưới 3 điểm)
  var forceTieOrOpponent = (myScore < 3 && oppScore < 3 && rndInt(100) < 60);
  
  if(forceTieOrOpponent){
    if(ev.rig === 1) { ev.s2 += 1; m = ev.n2 + " bứt lên (+1 điểm)"; }
    else { ev.s1 += 1; m = ev.n1 + " bứt lên (+1 điểm)"; }
  } else {
    if(ev.rig === 1){
      ev.s1 += 1;
      m = ev.n1 + " chiến thắng lượt này (+1 điểm)";
    } else if(ev.rig === 2){
      ev.s2 += 1;
      m = ev.n2 + " chiến thắng lượt này (+1 điểm)";
    } else {
      if(a === b) a++;
      if(a > b){ ev.s1 += 1; m = ev.n1 + " +1 điểm"; }
      else { ev.s2 += 1; m = ev.n2 + " +1 điểm"; }
    }
  }
  
  var win = ev.s1 >= ev.t ? ev.n1 : (ev.s2 >= ev.t ? ev.n2 : "");
  if(win){
    ev.over = true;
    m += " | " + win + " THẮNG CHUNG CUỘC!";
  }
  scoreboard(m);
}

function playQ(res){
  q.rounds++;
  var col=res[0];
  var w=q.p.filter(function(p){return p.c===col;});
  if(w.length){ w.forEach(function(p){p.w++;}); }
  else { q.house++; }
}

cfgRef.on("value", function(snap){
  var cfg = snap.val();
  if(!cfg) return;
  $("waiting").style.display="none";
  mode = cfg.mode || "n";
  nd = cfg.nd || 4;
  $("score").style.display = "none";
  ev.on = false; q.on = false;

  if(mode === "e" && cfg.ev){
    ev = {
      on: true, over: false, s1: 0, s2: 0,
      t: cfg.ev.t || 5, c1: cfg.ev.c1, c2: cfg.ev.c2,
      n1: cfg.ev.n1 || "Người 1", n2: cfg.ev.n2 || "Người 2",
      rig: cfg.ev.rig || 0
    };
    scoreboard("Bắt đầu! Bấm ROLL để chơi");
  } else if(mode === "q" && cfg.q && cfg.q.players){
    var p = cfg.q.players.map(function(x){ return {n: x.n, c: x.c, w: 0}; });
    q = {on: true, rounds: 0, house: 0, p: p};
  }
  show(mode === "q" ? [0] : [0,1,2,3,4,5].slice(0, nd));
  banner("Đã nhận cấu hình mới!");
});

var SECURE=!!(window.crypto&&window.crypto.getRandomValues);
function rndInt(n){
  var a=new Uint32Array(1),lim=Math.floor(4294967296/n)*n;
  do{
    if(SECURE)window.crypto.getRandomValues(a);
    else a[0]=Math.floor(Math.random()*4294967296);
  }while(a[0]>=lim);
  return a[0]%n;
}

function roll(){
  if(busy)return;
  if(mode==="e"){
    if(!ev.on){banner("Chưa có cấu hình!");return;}
    if(ev.over){banner("Đã có người thắng!");return;}
  }
  if(mode==="q"&&!q.on){banner("Chưa có cấu hình!");return;}
  
  busy=true;
  setTimeout(function(){busy=false;},500);
  
  var md=mode,n=(md==="q")?1:nd,t=0;
  var h=setInterval(function(){
    try{
      t++;
      if(t<4){var f=[];for(var i=0;i<n;i++)f.push(rndInt(6));show(f);}
      else{
        clearInterval(h);
        var res=[];
        if(md==="e" && ev.rig && ev.rig > 0){
          var targetColor = (ev.rig === 1) ? ev.c1 : ev.c2;
          var oppColor = (ev.rig === 1) ? ev.c2 : ev.c1;
          
          // CHỈ CHO RA TỐI ĐA 1 HOẶC 2 VIÊN MÀU MỤC TIÊU ĐỂ CỰC KỲ TỰ NHIÊN, KHÔNG BỊ LỘ
          var numTarget = 1 + (rndInt(100) < 40 ? 1 : 0); // 1 hoặc 2 viên
          var numOpp = rndInt(2); // 0 hoặc 1 viên của đối thủ
          
          for(var k=0; k<numTarget; k++) res.push(targetColor);
          for(var k=0; k<numOpp; k++) res.push(oppColor);
          
          while(res.length < n){
            var c = rndInt(6);
            if(c !== targetColor && c !== oppColor) {
              res.push(c);
            } else if(rndInt(100) < 15) {
              res.push(c);
            }
          }
          res.sort(function(){ return Math.random() - 0.5; });
        } else {
          for(var j=0;j<n;j++)res.push(rndInt(6));
        }
        
        show(res);
        res.forEach(function(c){cnt[c]++;});
        if(n===4&&res.filter(function(c,i){return res.indexOf(c)===i;}).length===4)fc++;
        rolls.unshift(res);if(rolls.length>20)rolls.pop();
        stats();
        busy=false;
        if(md==="e")playEvent(res);
        if(md==="q")playQ(res);
      }
    }catch(err){clearInterval(h);busy=false;}
  },25);
}
tap($("roll"),roll);
tap($("rs"),function(){cnt=[0,0,0,0,0,0];rolls=[];fc=0;stats();});
show([0,1,2,3]);stats();applyView();
</script>
</body></html>
