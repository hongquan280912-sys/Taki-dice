<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Taki Dice Fix</title>
<style>
  body {
    margin: 0;
    padding: 20px;
    font-family: Arial, sans-serif;
    background: #3b6ea5;
    display: flex;
    justify-content: center;
  }
  .box {
    width: 100%;
    max-width: 420px;
    background: rgba(255, 255, 255, 0.25);
    border: 4px solid #fff;
    border-radius: 22px;
    padding: 20px;
    text-align: center;
  }
  h2 { color: #fff; margin-top: 0; }
  #dice {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 12px;
    margin: 20px 0;
    min-height: 80px;
  }
  .d {
    width: 65px;
    height: 65px;
    border: 5px solid #fff;
    border-radius: 15px;
    background: #ff0000;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 4px 8px rgba(0,0,0,0.3);
  }
  .d i {
    width: 16px;
    height: 16px;
    border-radius: 50%;
    background: #fff;
  }
  button {
    width: 100%;
    padding: 15px;
    font-size: 24px;
    font-weight: bold;
    color: #fff;
    background: #3b9cff;
    border: 3px solid #fff;
    border-radius: 12px;
    cursor: pointer;
  }
</style>
</head>
<body>

<div class="box">
  <h2>Zalo Cuto</h2>
  <div id="dice">
    <div class="d"><i></i></div>
    <div class="d"><i></i></div>
    <div class="d"><i></i></div>
    <div class="d"><i></i></div>
  </div>
  <button id="roll">ROLL AGAIN !</button>
</div>

<script>
var C = ["#ff0000", "#ffa500", "#ffd700", "#008000", "#0000ff", "#800080"];
var box = document.getElementById("dice");

function rndInt(n) {
  return Math.floor(Math.random() * n);
}

document.getElementById("roll").addEventListener("click", function() {
  box.innerHTML = "";
  for (var i = 0; i < 4; i++) {
    var d = document.createElement("div");
    d.className = "d";
    d.style.background = C[rndInt(6)];
    d.appendChild(document.createElement("i"));
    box.appendChild(d);
  }
});
</script>

</body>
</html>
