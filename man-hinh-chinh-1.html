<!DOCTYPE html>
<html lang="vi"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Zalo Cuto - Taki Dice</title>
<style>
html,body{margin:0;padding:0;height:100%;background:#3b6ea5}
iframe{display:block;width:100%;height:100%;border:0}
</style></head><body>
<iframe id="g" allow="microphone; autoplay; clipboard-write"></iframe>
<script>
// Trang này chỉ nạp game.html (file gốc của bạn, không sửa gì)
// rồi thêm nút 🎤 cạnh hai ô tên.
var f=document.getElementById('g');
f.src='game.html'+(location.search||'');

function patch(){
  if(window.__micPatched)return;window.__micPatched=true;
  var SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  var panel=document.getElementById('localPanel');
  var st=document.createElement('div');
  st.className='lb';st.style.minHeight='16px';
  st.textContent='Bấm 🎤 cạnh ô tên rồi nói tên (ví dụ: Nam, hoặc Nam đỏ)';
  if(panel&&panel.firstElementChild)panel.firstElementChild.after(st);
  function msg(t){st.textContent=t;}
  function cap(s){return s.split(' ').map(function(w){return w.charAt(0).toUpperCase()+w.slice(1);}).join(' ');}
  ['n1','n2'].forEach(function(id){
    var inp=document.getElementById(id);if(!inp)return;
    var w=document.createElement('div');
    w.style.cssText='display:flex;gap:6px;align-items:flex-start';
    inp.parentNode.insertBefore(w,inp);w.appendChild(inp);
    inp.style.flex='1';inp.style.width='auto';inp.style.minWidth='0';
    var b=document.createElement('button');
    b.type='button';b.textContent='🎤';
    b.style.cssText='width:52px;min-height:0;height:44px;padding:0;font-size:20px;flex:none;background:#2a7a4b';
    w.appendChild(b);
    var rec=null;
    b.addEventListener('click',function(){
      if(!SR){msg('Trình duyệt không hỗ trợ nhận giọng nói. Hãy dùng Chrome.');return;}
      try{if(rec)rec.abort();}catch(e){}
      rec=new SR();rec.lang='vi-VN';rec.interimResults=false;rec.maxAlternatives=1;
      rec.onstart=function(){b.textContent='⏺';msg('🎤 Hãy nói tên...');};
      rec.onend=function(){b.textContent='🎤';};
      rec.onresult=function(e){
        var v=e.results[0][0].transcript.replace(/[.,!?]/g,' ').replace(/\s+/g,' ').trim();
        v=v.replace(/^ngư[ờơ]i\s*(1|2|một|hai|mù|ai)\s+/i,'');
        if(!v){msg('Không nghe rõ, thử lại.');return;}
        var name=v,color=-1;
        try{var p=parseChat(v);name=p.name||v;color=p.color;}catch(x){}
        inp.value=cap(name.toLowerCase());
        if(color>=0){
          try{
            if(id==='n1'&&color!==localSel2){localSel1=color;swatches('sw1',localSel1,function(i){localSel1=i;});}
            if(id==='n2'&&color!==localSel1){localSel2=color;swatches('sw2',localSel2,function(i){localSel2=i;});}
          }catch(x){}
        }
        inp.dispatchEvent(new Event('input',{bubbles:true}));
        msg('Đã điền: '+inp.value);
      };
      rec.onerror=function(e){
        msg(e.error==='not-allowed'||e.error==='service-not-allowed'
          ?'Chưa được phép dùng mic. Hãy cho phép micro cho trang này.'
          :'Lỗi mic: '+(e.error||''));
      };
      try{rec.start();}catch(x){msg('Không bật được mic.');}
    });
  });
}

f.addEventListener('load',function(){
  try{
    var d=f.contentDocument;
    if(!d||!d.getElementById('n1'))return;
    var s=d.createElement('script');
    s.textContent='('+patch.toString()+')();';
    d.body.appendChild(s);
  }catch(e){}
});
</script>
</body></html>
