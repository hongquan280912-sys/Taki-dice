function vstat(t){$("vs").textContent=t;}
function banner(t){ban.textContent=t;clearTimeout(banner.t);banner.t=setTimeout(function(){ban.textContent="";},3500);}

function loadV(){try{voices=window.speechSynthesis.getVoices()||[];}catch(e){}}
try{if(window.speechSynthesis){loadV();window.speechSynthesis.onvoiceschanged=loadV;}}catch(e){}

var sq=[],sBusy=false,talking=false,sid=0;
function say(text){sq.push(text);sProcess();}
function stopSpeech(){
  sq.length=0;sid++;sBusy=false;talking=false;
  try{if(window.speechSynthesis)window.speechSynthesis.cancel();}catch(e){}
  try{ae.pause();}catch(e){}
}
function sProcess(){
  if(sBusy||!sq.length)return;
  sBusy=true;
  var text=sq.shift(),id=++sid,finished=false,started=false,viaG=false;
  banner(text);
  function done(){
    if(finished||id!==sid)return;
    finished=true;talking=false;sBusy=false;
    setTimeout(sProcess,150);
  }
  function mark(){if(id===sid){started=true;talking=true;}}
  function google(){
    if(viaG||finished||id!==sid)return;
    viaG=true;
    try{if(window.speechSynthesis)window.speechSynthesis.cancel();}catch(e){}
    ae.onplaying=function(){mark();vstat("Giọng đọc: Google ✓");};
    ae.onended=done;
    ae.onerror=function(){vstat("Máy không phát được giọng đọc");done();};
    try{
      ae.src="https://translate.google.com/translate_tts?ie=UTF-8&client=tw-ob&tl=vi&q="+encodeURIComponent(text);
      var p=ae.play();
      if(p&&p.catch)p.catch(function(){vstat("Máy không phát được giọng đọc");done();});
    }catch(e){done();}
  }
  setTimeout(done,8000);
  try{
    var s=window.speechSynthesis;
    if(!s||typeof SpeechSynthesisUtterance==="undefined"){google();return;}
    if(s.paused)s.resume();
    if(!voices.length)loadV();
    var u=new SpeechSynthesisUtterance(text);
    u.lang="vi-VN";u.rate=1;u.pitch=1;u.volume=1;
    var v=voices.filter(function(x){return x.lang&&x.lang.toLowerCase().indexOf("vi")===0;});
    if(v.length)u.voice=v[0];
    u.onstart=function(){mark();vstat("Giọng đọc: trình duyệt ✓");};
    u.onend=function(){if(!viaG)done();};
    u.onerror=function(){if(viaG)return;if(!started)google();else done();};
    s.speak(u);
    setTimeout(function(){if(!started&&!finished)google();},1200);
  }catch(e){google();}
}
